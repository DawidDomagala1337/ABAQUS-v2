<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#000"></path>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; }
    </style>
  </defs>
  <!-- Front rectangle -->
  <polygon points="70,170 250,170 250,80 70,80" fill="#ffffff" stroke="#000" stroke-width="2"></polygon>
  <!-- Back rectangle -->
  <polygon points="120,210 300,210 300,120 120,120" fill="#ffffff" stroke="#000" stroke-width="2"></polygon>
  <!-- Connecting edges -->
  <line x1="70" y1="170" x2="120" y2="210" stroke="#000" stroke-width="2"></line>
  <line x1="250" y1="170" x2="300" y2="210" stroke="#000" stroke-width="2"></line>
  <line x1="250" y1="80" x2="300" y2="120" stroke="#000" stroke-width="2"></line>
  <line x1="70" y1="80" x2="120" y2="120" stroke="#000" stroke-width="2"></line>
  <!-- Hidden edge -->
  <line x1="70" y1="170" x2="70" y2="80" stroke="#000" stroke-width="1.5" stroke-dasharray="6 5"></line>
  <!-- Axes -->
  <line x1="70" y1="170" x2="25" y2="170" stroke="#000" stroke-width="2" marker-end="url(#arrow)"></line>
  <text x="15" y="165">X</text>
  <line x1="70" y1="170" x2="70" y2="230" stroke="#000" stroke-width="2" marker-end="url(#arrow)"></line>
  <text x="62" y="245">Y</text>
  <line x1="70" y1="170" x2="70" y2="110" stroke="#000" stroke-width="2" marker-end="url(#arrow)"></line>
  <text x="60" y="100">Z</text>
  <!-- Dimension labels -->
  <text x="160" y="185">2a</text>
  <text x="48" y="125">2h</text>
  <text x="95" y="215">2b</text>
</svg>